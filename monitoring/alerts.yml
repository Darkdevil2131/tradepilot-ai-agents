groups:
  - name: tradepilot
    rules:
      - alert: TradePilotHighServerErrorRate
        expr: sum(rate(tradepilot_http_errors_total[5m])) / clamp_min(sum(rate(tradepilot_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TradePilot server error rate is above 5 percent
      - alert: TradePilotNoTraffic
        expr: sum(increase(tradepilot_http_requests_total[15m])) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: No TradePilot API traffic observed
